<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EXOTIC LINOX AI</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#070707;
    color:white;
    font-family:Arial, sans-serif;
    min-height:100vh;
}

.container{
    width:100%;
    max-width:850px;
    margin:auto;
    padding:20px;
}

.header{
    text-align:center;
    padding:30px 10px;
}

.logo{
    font-size:35px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    color:#ff3b30;
}

.subtitle{
    margin-top:10px;
    color:#999;
}

.card{
    background:#111116;
    border:1px solid #292930;
    border-radius:18px;
    padding:20px;
    margin-top:18px;
}

.title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:20px;
}

label{
    display:block;
    color:#aaa;
    font-size:14px;
    margin-bottom:7px;
}

input,
select{
    width:100%;
    background:#19191f;
    color:white;
    border:1px solid #303038;
    border-radius:12px;
    padding:14px;
    margin-bottom:16px;
    outline:none;
    font-size:15px;
}

input:focus,
select:focus{
    border-color:#ff3b30;
}

.generate{
    width:100%;
    background:#ff3b30;
    color:white;
    border:none;
    border-radius:12px;
    padding:16px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.generate:active{
    transform:scale(.98);
}

.result{
    display:none;
}

.device{
    background:#19191f;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
}

.device small{
    color:#888;
}

.device strong{
    display:block;
    margin-top:5px;
    font-size:18px;
}

.config{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.box{
    background:#19191f;
    border:1px solid #292930;
    padding:16px;
    border-radius:13px;
}

.box small{
    display:block;
    color:#888;
    margin-bottom:8px;
}

.box strong{
    font-size:25px;
}

.optimization{
    margin-top:15px;
    background:#19191f;
    border-radius:13px;
    padding:16px;
    line-height:1.6;
    color:#ccc;
}

.optimization strong{
    color:white;
}

.copy{
    width:100%;
    margin-top:15px;
    background:white;
    color:black;
    border:none;
    border-radius:12px;
    padding:15px;
    font-weight:bold;
    cursor:pointer;
}

.footer{
    text-align:center;
    color:#666;
    padding:30px 10px;
    font-size:12px;
}

@media(max-width:600px){

    .container{
        padding:14px;
    }

    .logo{
        font-size:28px;
    }

    .config{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div class="container">

<!-- ==============================
     CABECERA
============================== -->

<div class="header">

    <div class="logo">
        EXOTIC <span>LINOX</span>
    </div>

    <p class="subtitle">
        🤖 EXOTIC LINOX AI
        <br>
        Generador de configuraciones para Free Fire
    </p>

</div>


<!-- ==============================
     FORMULARIO
============================== -->

<div class="card">

    <div class="title">
        ⚡ Crear configuración
    </div>


    <label>
        Marca del teléfono
    </label>

    <select id="brand">

        <option value="">
            Selecciona una marca
        </option>

        <option value="Samsung">
            Samsung
        </option>

        <option value="Redmi">
            Redmi
        </option>

        <option value="POCO">
            POCO
        </option>

        <option value="Xiaomi">
            Xiaomi
        </option>

        <option value="TECNO">
            TECNO
        </option>

        <option value="Infinix">
            Infinix
        </option>

        <option value="Motorola">
            Motorola
        </option>

        <option value="OnePlus">
            OnePlus
        </option>

        <option value="Realme">
            Realme
        </option>

        <option value="OPPO">
            OPPO
        </option>

        <option value="Vivo">
            Vivo
        </option>

        <option value="Huawei">
            Huawei
        </option>

        <option value="Honor">
            Honor
        </option>

        <option value="Apple">
            Apple
        </option>

        <option value="Otra">
            Otra
        </option>

    </select>


    <label>
        Modelo
    </label>

    <input
        id="model"
        type="text"
        placeholder="Ejemplo: Redmi Note 12"
    >


    <label>
        Tipo de sensibilidad
    </label>

    <select id="level">

        <option value="high">
            🔥 Sensibilidad alta
        </option>

        <option value="medium">
            ⚡ Sensibilidad media
        </option>

        <option value="low">
            🎮 Sensibilidad baja
        </option>

    </select>


    <label>
        RAM del teléfono
    </label>

    <select id="ram">

        <option value="3">
            3 GB
        </option>

        <option value="4">
            4 GB
        </option>

        <option value="6">
            6 GB
        </option>

        <option value="8" selected>
            8 GB
        </option>

        <option value="12">
            12 GB
        </option>

        <option value="16">
            16 GB
        </option>

    </select>


    <label>
        Cantidad de dedos
    </label>

    <select id="fingers">

        <option value="2">
            2 dedos
        </option>

        <option value="3">
            3 dedos
        </option>

        <option value="4">
            4 dedos
        </option>

        <option value="5">
            5 dedos
        </option>

        <option value="6">
            6 dedos
        </option>

    </select>


    <button
        type="button"
        class="generate"
        id="generateButton"
    >
        🔥 GENERAR SENSIBILIDAD
    </button>

</div>


<!-- ==============================
     RESULTADO
============================== -->

<div
    class="card result"
    id="result"
>

    <div class="title">
        🤖 EXOTIC LINOX AI
    </div>


    <div class="device">

        <small>
            📱 Dispositivo
        </small>

        <strong id="deviceResult">
            -
        </strong>

    </div>


    <div class="config">

        <div class="box">

            <small>
                🎯 General
            </small>

            <strong id="general">
                -
            </strong>

        </div>


        <div class="box">

            <small>
                🔴 Punto rojo
            </small>

            <strong id="redDot">
                -
            </strong>

        </div>


        <div class="box">

            <small>
                🔍 Mira 2X
            </small>

            <strong id="scope2">
                -
            </strong>

        </div>


        <div class="box">

            <small>
                🔭 Mira 4X
            </small>

            <strong id="scope4">
                -
            </strong>

        </div>


        <div class="box">

            <small>
                🎯 AWM
            </small>

            <strong id="awm">
                -
            </strong>

        </div>


        <div class="box">

            <small>
                🔘 Botón de disparo
            </small>

            <strong id="fireButton">
                -
            </strong>

        </div>


        <div class="box">

            <small>
                📱 DPI
            </small>

            <strong id="dpi">
                -
            </strong>

        </div>

    </div>


    <div class="optimization">

        <strong>
            ⚙️ Optimización
        </strong>

        <p id="optimization">
            -
        </p>

    </div>


    <button
        type="button"
        class="copy"
        id="copyButton"
    >
        📋 COPIAR CONFIGURACIÓN
    </button>

</div>


<div class="footer">

    EXOTIC LINOX AI

    <br><br>

    Configurador personalizado

</div>

</div>


<script>

/* ==========================================
   FUNCIÓN PARA GENERAR NÚMEROS
========================================== */

function randomNumber(min,max){

    return Math.floor(
        Math.random() * (max - min + 1)
    ) + min;

}


/* ==========================================
   COMPROBAR SI ES IPHONE
========================================== */

function isIphone(){

    const brand =
        document.getElementById("brand").value;

    const model =
        document.getElementById("model").value
        .toLowerCase();

    return (
        brand === "Apple" ||
        model.includes("iphone")
    );

}


/* ==========================================
   GENERAR CONFIGURACIÓN
========================================== */

function generateConfig(){

    const brand =
        document.getElementById("brand").value;

    const model =
        document.getElementById("model").value.trim();

    const level =
        document.getElementById("level").value;

    const ram =
        Number(
            document.getElementById("ram").value
        );

    const fingers =
        Number(
            document.getElementById("fingers").value
        );


    /* COMPROBAR DATOS */

    if(brand === ""){

        alert(
            "⚠️ Selecciona la marca de tu teléfono."
        );

        return;

    }


    if(model === ""){

        alert(
            "⚠️ Escribe el modelo de tu teléfono."
        );

        return;

    }


    /* VARIABLES */

    let general;
    let redDot;
    let scope2;
    let scope4;
    let awm;
    let fireButton;
    let dpi;


    /* ======================================
       SENSIBILIDAD ALTA
       GENERAL 170 - 200
    ====================================== */

    if(level === "high"){

        general =
            randomNumber(170,200);

        redDot =
            randomNumber(170,200);

        scope2 =
            randomNumber(170,200);

        scope4 =
            randomNumber(170,200);

        awm =
            randomNumber(170,200);

        fireButton =
            randomNumber(65,83);

        if(isIphone()){

            dpi =
                "No disponible";

        }else{

            dpi =
                randomNumber(520,620);

        }

    }


    /* ======================================
       SENSIBILIDAD MEDIA
       GENERAL 130 - 160
    ====================================== */

    if(level === "medium"){

        general =
            randomNumber(130,160);

        redDot =
            randomNumber(130,160);

        scope2 =
            randomNumber(130,160);

        scope4 =
            randomNumber(130,160);

        awm =
            randomNumber(130,160);

        fireButton =
            randomNumber(38,57);

        if(isIphone()){

            dpi =
                "No disponible";

        }else{

            dpi =
                randomNumber(450,520);

        }

    }


    /* ======================================
       SENSIBILIDAD BAJA
       GENERAL 75 - 125
    ====================================== */

    if(level === "low"){

        general =
            randomNumber(75,125);

        redDot =
            randomNumber(75,125);

        scope2 =
            randomNumber(75,125);

        scope4 =
            randomNumber(75,125);

        awm =
            randomNumber(75,125);

        fireButton =
            randomNumber(38,57);

        if(isIphone()){

            dpi =
                "No disponible";

        }else{

            dpi =
                randomNumber(360,450);

        }

    }


    /* ======================================
       AJUSTE POR RAM
    ====================================== */

    if(ram <= 4){

        general =
            Math.max(75,general - 2);

        redDot =
            Math.max(75,redDot - 2);

    }


    if(ram >= 12){

        general =
            Math.min(200,general + 2);

        redDot =
            Math.min(200,redDot + 2);

    }


    /* ======================================
       AJUSTE POR DEDOS
    ====================================== */

    if(fingers >= 4){

        fireButton =
            Math.max(38,fireButton - 2);

    }


    if(fingers === 2){

        fireButton =
            Math.min(83,fireButton + 2);

    }


    /* ======================================
       MOSTRAR RESULTADO
    ====================================== */

    document.getElementById(
        "deviceResult"
    ).textContent =
        brand + " " + model;


    document.getElementById(
        "general"
    ).textContent =
        general;


    document.getElementById(
        "redDot"
    ).textContent =
        redDot;


    document.getElementById(
        "scope2"
    ).textContent =
        scope2;


    document.getElementById(
        "scope4"
    ).textContent =
        scope4;


    document.getElementById(
        "awm"
    ).textContent =
        awm;


    document.getElementById(
        "fireButton"
    ).textContent =
        fireButton + "%";


    document.getElementById(
        "dpi"
    ).textContent =
        dpi;


    /* ======================================
       OPTIMIZACIÓN
    ====================================== */

    let optimization = "";


    if(ram <= 4){

        optimization =
            "Usa gráficos moderados, prioriza FPS estables, "
            + "cierra aplicaciones en segundo plano y evita "
            + "jugar mientras el teléfono esté demasiado caliente.";

    }

    else if(ram <= 8){

        optimization =
            "Prioriza FPS estables, cierra aplicaciones "
            + "innecesarias antes de jugar y utiliza el modo "
            + "juego o rendimiento si tu dispositivo lo incluye.";

    }

    else{

        optimization =
            "Tu dispositivo tiene suficiente memoria para "
            + "priorizar una experiencia fluida. Mantén "
            + "aplicaciones innecesarias cerradas y controla "
            + "la temperatura del teléfono.";

    }


    document.getElementById(
        "optimization"
    ).textContent =
        optimization;


    /* ======================================
       MOSTRAR TARJETA
    ====================================== */

    const result =
        document.getElementById("result");

    result.style.display =
        "block";


    result.scrollIntoView({
        behavior:"smooth"
    });

}


/* ==========================================
   BOTÓN GENERAR
========================================== */

document.getElementById(
    "generateButton"
).addEventListener(
    "click",
    generateConfig
);


/* ==========================================
   COPIAR
========================================== */

document.getElementById(
    "copyButton"
).addEventListener(
    "click",
    function(){

        const text =

`🔥 EXOTIC LINOX AI

📱 Dispositivo:
${document.getElementById("deviceResult").textContent}

🎯 Sensibilidad

General:
${document.getElementById("general").textContent}

Punto rojo:
${document.getElementById("redDot").textContent}

Mira 2X:
${document.getElementById("scope2").textContent}

Mira 4X:
${document.getElementById("scope4").textContent}

AWM:
${document.getElementById("awm").textContent}

🔘 Botón:
${document.getElementById("fireButton").textContent}

📱 DPI:
${document.getElementById("dpi").textContent}

⚙️ Optimización:
${document.getElementById("optimization").textContent}

🤖 Generado por EXOTIC LINOX AI`;


        if(
            navigator.clipboard &&
            window.isSecureContext
        ){

            navigator.clipboard
            .writeText(text)
            .then(function(){

                alert(
                    "✅ Configuración copiada."
                );

            })
            .catch(function(){

                alert(
                    "❌ No se pudo copiar."
                );

            });

        }else{

            /* MÉTODO ALTERNATIVO */

            const textarea =
                document.createElement("textarea");

            textarea.value = text;

            document.body.appendChild(
                textarea
            );

            textarea.select();

            try{

                document.execCommand("copy");

                alert(
                    "✅ Configuración copiada."
                );

            }catch(error){

                alert(
                    "❌ No se pudo copiar."
                );

            }

            document.body.removeChild(
                textarea
            );

        }

    }
);

</script>

</body>
    </html>
